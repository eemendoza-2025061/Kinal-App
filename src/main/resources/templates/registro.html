<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - KinalApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="register-page">
<div class="register-container">
    <div class="register-card">
        <div class="logo-section">
            <img src="/css/logo.png" alt="KinalApp Logo">
            <h1>KinalApp</h1>
        </div>

        <div class="register-header">
            <h3>Crear Cuenta</h3>
            <p>Regístrate para comenzar</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span>⚠️</span> <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <span>✅</span> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="form-group">
                <label>👤 Usuario</label>
                <input type="text" th:field="*{username}" placeholder="Nombre de usuario" required>
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" th:field="*{password}" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" th:field="*{email}" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select th:field="*{rol}">
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success btn-block">✅ Crear Cuenta</button>
        </form>

        <div class="login-link">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </div>
    </div>
</div>
</body>
</html>
