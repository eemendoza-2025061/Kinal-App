<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - KinalApp">KinalApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/web/menu}">
        <img th:src="@{/css/logo.png}" alt="KinalApp Logo">
        <span>KinalApp</span>
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/web/menu}" th:classappend="${#httpServletRequest.requestURI == '/web/menu'} ? 'nav-active'">🏠 Inicio</a></li>
        <li><a th:href="@{/clientes/web}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/clientes')} ? 'nav-active'">👥 Clientes</a></li>
        <li><a th:href="@{/productos/web}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/productos')} ? 'nav-active'">📦 Productos</a></li>
        <li><a th:href="@{/usuarios/web}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/usuarios')} ? 'nav-active'">👤 Usuarios</a></li>
        <li><a th:href="@{/ventas/web}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/ventas')} ? 'nav-active'">💰 Ventas</a></li>
        <li><a th:href="@{/detalleventa/web}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/detalleventa')} ? 'nav-active'">🧾 Det. Ventas</a></li>
    </ul>
    <div>
        <a th:href="@{/logout}" class="btn-logout">🚪 Salir</a>
    </div>
</nav>

<div class="page-content">
    <div layout:fragment="content"></div>
</div>

<footer>
    <p>&copy; 2025 KinalApp — Sistema de Ventas | Desarrollado con 💙</p>
</footer>
</body>
</html>
