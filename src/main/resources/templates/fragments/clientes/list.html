<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - KinalApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0c10;
            color: #e2e8f0;
        }

        .navbar {
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(20px);
            padding: 0 32px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 50px;
            width: auto;
        }

        .navbar-brand span {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            list-style: none;
        }

        .navbar-nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .navbar-nav a:hover,
        .navbar-nav a.active {
            color: white;
            background: rgba(0, 212, 255, 0.1);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .btn-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .page-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .table-wrapper {
            background: #111317;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 212, 255, 0.05);
        }

        th {
            padding: 16px;
            text-align: left;
            color: #00d4ff;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-inactive {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-left: 3px solid #10b981;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-left: 3px solid #ef4444;
        }

        footer {
            background: #111317;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/web/menu}">
        <img src="/css/logo.png" alt="KinalApp Logo">
        <span>KinalApp</span>
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/web/menu}">Inicio</a></li>
        <li><a th:href="@{/clientes/web}" class="active">Clientes</a></li>
        <li><a th:href="@{/productos/web}">Productos</a></li>
        <li><a th:href="@{/usuarios/web}">Usuarios</a></li>
        <li><a th:href="@{/ventas/web}">Ventas</a></li>
        <li><a th:href="@{/detalleventa/web}">Det. Ventas</a></li>
    </ul>
    <div>
        <a th:href="@{/logout}" class="btn-logout">Salir</a>
    </div>
</nav>

<div class="page-content">
    <div class="page-header">
        <h2>👥 Clientes</h2>
        <a th:href="@{/clientes/web/nuevo}" class="btn btn-primary">➕ Nuevo Cliente</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        ✅ <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        ⚠️ <span th:text="${error}"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>DPI o CUI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.dpiCliente}">-</td>
                <td th:text="${c.nombreCliente}">-</td>
                <td th:text="${c.apellidoCliente}">-</td>
                <td th:text="${c.direccion}">-</td>
                <td>
                            <span class="badadge" th:classappend="${c.estado == 1} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${c.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td class="table-actions">
                    <a th:href="@{/clientes/web/editar/{dpi}(dpi=${c.dpiCliente})}" class="btn btn-warning">✏️ Editar</a>
                    <a th:href="@{/clientes/web/eliminar/{dpi}(dpi=${c.dpiCliente})}" class="btn btn-danger" onclick="return confirm('¿Eliminar este cliente?')">🗑️ Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="6" style="text-align:center; padding: 40px;">No hay clientes registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <p>&copy; 2025 KinalApp — Sistema de Ventas</p>
</footer>
</body>
</html>
