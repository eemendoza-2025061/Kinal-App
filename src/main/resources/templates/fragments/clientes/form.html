<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.dpiCliente == null} ? 'Nuevo Cliente - KinalApp' : 'Editar Cliente - KinalApp'">Formulario Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Space Grotesk', sans-serif;
            background: #0a0c10;
            color: #e2e8f0;
        }

        .navbar {
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(20px);
            padding: 0 32px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 50px;
            width: auto;
        }

        .navbar-brand span {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            list-style: none;
        }

        .navbar-nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .navbar-nav a:hover,
        .navbar-nav a.nav-active {
            color: white;
            background: rgba(0, 212, 255, 0.1);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .page-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-card {
            background: #111317;
            border-radius: 20px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.875rem;
            color: #e2e8f0;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        footer {
            background: #111317;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/web/menu}">
        <img src="/css/logo.png" alt="KinalApp Logo">
        <span>KinalApp</span>
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/web/menu}">Inicio</a></li>
        <li><a th:href="@{/clientes/web}" class="nav-active">Clientes</a></li>
        <li><a th:href="@{/productos/web}">Productos</a></li>
        <li><a th:href="@{/usuarios/web}">Usuarios</a></li>
        <li><a th:href="@{/ventas/web}">Ventas</a></li>
        <li><a th:href="@{/detalleventa/web}">Det. Ventas</a></li>
    </ul>
    <div>
        <a th:href="@{/logout}" class="btn-logout">Salir</a>
    </div>
</nav>

<div class="page-content">
    <div class="page-header">
        <h2 th:text="${cliente.dpiCliente == null} ? '➕ Nuevo Cliente' : '✏️ Editar Cliente'">Formulario</h2>
    </div>

    <div class="form-card">
        <form th:action="${cliente.dpiCliente == null} ? @{/clientes/web/guardar} : @{/clientes/web/actualizar/{dpi}(dpi=${cliente.dpiCliente})}"
              th:object="${cliente}" method="post">
            <div class="form-group">
                <label>DPI o CUI</label>
                <input type="number" th:field="*{dpiCliente}" th:readonly="${cliente.dpiCliente != null}" placeholder="Número de DPI" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombreCliente}" placeholder="Nombre del cliente" required>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" th:field="*{apellidoCliente}" placeholder="Apellido del cliente" required>
                </div>
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" placeholder="Dirección" required>
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a th:href="@{/clientes/web}" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2025 KinalApp — Sistema de Ventas</p>
</footer>
</body>
</html>
