<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Formulario Producto - KinalApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2 th:text="${producto.codigoProducto == null} ? '➕ Nuevo Producto' : '✏️ Editar Producto'">Formulario</h2>
    </div>

    <div class="form-card">
        <form th:action="${producto.codigoProducto == null} ? @{/productos/web/guardar} : @{/productos/web/actualizar/{codigo}(codigo=${producto.codigoProducto})}"
              th:object="${producto}" method="post">

            <div class="form-group">
                <label>📦 Nombre</label>
                <input type="text" th:field="*{nombreProducto}" placeholder="Nombre del producto" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>💵 Precio</label>
                    <input type="number" step="0.01" th:field="*{precio}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>📊 Stock</label>
                    <input type="number" th:field="*{stock}" placeholder="Cantidad en stock" required>
                </div>
            </div>

            <div class="form-group">
                <label>🔘 Estado</label>
                <select th:field="*{estado}">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a th:href="@{/productos/web}" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
