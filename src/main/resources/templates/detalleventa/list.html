<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Detalle Ventas - KinalApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2>🧾 Detalle de Ventas</h2>
        <a th:href="@{/detalleventa/web/nuevo}" class="btn btn-primary">➕ Nuevo Detalle</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <span>✅</span> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <span>⚠️</span> <span th:text="${error}"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Venta</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Subtotal</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.codigoDetalleVenta}">-</td>
                <td th:text="${d.producto != null ? d.producto.nombreProducto : '-'}">-</td>
                <td th:text="${d.venta != null ? d.venta.codigoVenta : '-'}">-</td>
                <td th:text="${d.cantidad}">-</td>
                <td th:text="'Q ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}">-</td>
                <td th:text="'Q ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}">-</td>
                <td>
                            <span class="badge" th:classappend="${d.estado == 1} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${d.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td class="table-actions">
                    <a th:href="@{/detalleventa/web/editar/{codigo}(codigo=${d.codigoDetalleVenta})}" class="btn btn-warning">✏️ Editar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(detalles)}">
                <td colspan="8" style="text-align:center; padding: 40px; color: #64748b;">
                    No hay detalles de venta registrados
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
