<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Formulario Detalle Venta - KinalApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2 th:text="${detalle.codigoDetalleVenta == null} ? '➕ Nuevo Detalle' : '✏️ Editar Detalle'">Formulario</h2>
    </div>

    <div class="form-card">
        <form th:action="${detalle.codigoDetalleVenta == null} ? @{/detalleventa/web/guardar} : @{/detalleventa/web/actualizar/{codigo}(codigo=${detalle.codigoDetalleVenta})}"
              th:object="${detalle}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label>📦 Producto</label>
                    <select th:field="*{producto.codigoProducto}">
                        <option value="">-- Seleccione un producto --</option>
                        <option th:each="p : ${productos}" th:value="${p.codigoProducto}" th:text="${p.nombreProducto}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 Venta</label>
                    <select th:field="*{venta.codigoVenta}">
                        <option value="">-- Seleccione una venta --</option>
                        <option th:each="v : ${ventas}" th:value="${v.codigoVenta}" th:text="'Venta #' + ${v.codigoVenta} + ' - ' + ${v.fechaVenta}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🔢 Cantidad</label>
                    <input type="number" th:field="*{cantidad}" placeholder="Cantidad" required>
                </div>

                <div class="form-group">
                    <label>💵 Precio Unitario</label>
                    <input type="number" step="0.01" th:field="*{precioUnitario}" placeholder="0.00" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🧮 Subtotal</label>
                    <input type="number" step="0.01" th:field="*{subtotal}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>🔘 Estado</label>
                    <select th:field="*{estado}">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a th:href="@{/detalleventa/web}" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
