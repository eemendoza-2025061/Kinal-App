<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Formulario Usuario - KinalApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2 th:text="${usuario.codigoUsuario == null} ? '➕ Nuevo Usuario' : '✏️ Editar Usuario'">Formulario</h2>
    </div>

    <div class="form-card">
        <div th:if="${error}" class="alert alert-error">
            <span>⚠️</span> <span th:text="${error}"></span>
        </div>

        <form th:action="${usuario.codigoUsuario == null} ? @{/usuarios/web/guardar} : @{/usuarios/web/actualizar/{codigo}(codigo=${usuario.codigoUsuario})}"
              th:object="${usuario}" method="post">

            <div th:if="${usuario.codigoUsuario != null}" class="form-group">
                <label>🔑 Código de Usuario</label>
                <input type="text" th:value="${usuario.codigoUsuario}" readonly>
                <div class="form-hint">El código es asignado automáticamente</div>
            </div>

            <div class="form-group">
                <label>👤 Nombre de Usuario</label>
                <input type="text" th:field="*{username}" placeholder="Ej: jperez" required>
            </div>

            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" th:field="*{password}" placeholder="••••••••" required>
                <div class="form-hint" th:if="${usuario.codigoUsuario != null}">Escribe la nueva contraseña para actualizarla</div>
            </div>

            <div class="form-group">
                <label>📧 Correo Electrónico</label>
                <input type="email" th:field="*{email}" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🎭 Rol</label>
                    <select th:field="*{rol}" required>
                        <option value="">-- Seleccione --</option>
                        <option value="USER">Usuario</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🔘 Estado</label>
                    <select th:field="*{estado}">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a th:href="@{/usuarios/web}" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
