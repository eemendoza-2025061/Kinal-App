<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Usuarios - KinalApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h2>👤 Usuarios</h2>
        <a th:href="@{/usuarios/web/nuevo}" class="btn btn-primary">➕ Nuevo Usuario</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <span>✅</span> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <span>⚠️</span> <span th:text="${error}"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Username</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.codigoUsuario}">-</td>
                <td th:text="${u.username}">-</td>
                <td th:text="${u.email}">-</td>
                <td>
                            <span class="badge" th:classappend="${u.rol == 'ADMIN'} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${u.rol}"></span>
                </td>
                <td>
                            <span class="badge" th:classappend="${u.estado == 1} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${u.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td class="table-actions">
                    <a th:href="@{/usuarios/web/editar/{codigo}(codigo=${u.codigoUsuario})}" class="btn btn-warning">✏️ Editar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6" style="text-align:center; padding: 40px; color: #64748b;">
                    No hay usuarios registrados
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
