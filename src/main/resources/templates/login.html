<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - KinalApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-card">
        <div class="logo-section">
            <img src="/css/logo.png" alt="KinalApp Logo">
            <h1>KinalApp</h1>
            <p>Sistema de Ventas</p>
        </div>

        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span>⚠️</span> <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <span>✅</span> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>📧 Usuario</label>
                <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus>
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar →</button>
        </form>

        <div class="divider">
            <span>¿Nuevo aquí?</span>
        </div>
        <div class="register-link">
            <a th:href="@{/registro}">✨ Crear cuenta gratis</a>
        </div>
    </div>
</div>
</body>
</html>
