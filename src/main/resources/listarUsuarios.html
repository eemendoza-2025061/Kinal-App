<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }
        .navbar {
            background-color: #1e293b !important; /* Slate 800 */
            border-bottom: 1px solid #334155;
            padding: 1.25rem 0 !important;
        }
        .main-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem !important; /* Relleno generoso */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        /* Estilos de la Tabla SaaS */
        .table-responsive {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .table {
            margin-bottom: 0;
            color: #cbd5e1;
            vertical-align: middle;
        }
        .table th {
            background-color: #0f172a !important;
            color: #ffffff !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1.25rem 1.5rem !important;
            border-bottom: 2px solid #334155 !important;
        }
        .table td {
            padding: 1.25rem 1.5rem !important; /* Más relleno en celdas */
            background-color: #1e293b !important;
            border-bottom: 1px solid #334155 !important;
            color: #e2e8f0;
        }
        .table-hover tbody tr:hover td {
            background-color: #24334d !important; /* Hover sutil */
            color: #ffffff;
        }
        /* Botones y Badges personalizados */
        .btn-custom {
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-action {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
            border: none;
        }
        .btn-action-edit {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        .btn-action-edit:hover {
            background-color: #f59e0b;
            color: #1e293b;
        }
        .btn-action-delete {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .btn-action-delete:hover {
            background-color: #ef4444;
            color: #ffffff;
        }
        .badge-custom {
            padding: 0.5rem 0.75rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="/menu">
            <span class="me-2">🏠</span> KinalApp
        </a>
        <div class="navbar-nav ms-auto align-items-center">
            <span class="navbar-text me-4 text-light fw-medium">
                👤 <span th:text="${usuario.username}"></span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm px-3 rounded-pill">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <div class="main-card">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-white m-0">
                    <i class="bi bi-person-badge-fill text-warning me-2"></i> Gestión de Usuarios
                </h2>
                <p class="text-secondary small m-0 mt-1">Administra las credenciales, accesos, roles globales y cuentas de usuario</p>
            </div>
            <a href="/web/usuarios/nuevo" class="btn btn-warning text-dark btn-custom shadow-sm d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle fs-5"></i> Nuevo Usuario
            </a>
        </div>

        <div th:if="${mensaje}" class="alert alert-success bg-success-subtle text-success border-0 alert-dismissible fade show p-3 rounded-3 mb-4 small" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger bg-danger-subtle text-danger border-0 alert-dismissible fade show p-3 rounded-3 mb-4 small" role="alert">
            <i class="bi bi-x-circle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="table-responsive shadow-sm">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="fw-medium text-white" th:text="${u.codigoUsuario}"></td>
                    <td class="text-white-50 fw-semibold" th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span th:if="${u.rol == 'ADMIN'}" class="badge badge-custom bg-danger-subtle text-danger">ADMIN</span>
                        <span th:if="${u.rol == 'USER'}" class="badge badge-custom bg-primary-subtle text-primary">USER</span>
                        <span th:if="${u.rol != 'ADMIN' and u.rol != 'USER'}" class="badge badge-custom bg-secondary-subtle text-secondary" th:text="${u.rol}"></span>
                    </td>
                    <td>
                        <span th:if="${u.estado == 1}" class="badge badge-custom bg-success-subtle text-success">
                            <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i> Activo
                        </span>
                        <span th:if="${u.estado == 0}" class="badge badge-custom bg-danger-subtle text-danger">
                            <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i> Inactivo
                        </span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/web/usuarios/editar/{codigo}(codigo=${u.codigoUsuario})}"
                               class="btn-action btn-action-edit" title="Editar usuario">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <a th:href="@{/web/usuarios/eliminar/{codigo}(codigo=${u.codigoUsuario})}"
                               class="btn-action btn-action-delete"
                               onclick="return confirm('¿Está seguro de eliminar este usuario?')" title="Eliminar usuario">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 pt-2">
            <a href="/menu" class="btn btn-outline-secondary btn-custom d-inline-flex align-items-center gap-2" style="border-color: #334155; color: #cbd5e1;">
                <i class="bi bi-arrow-left fs-5"></i> Volver al menú
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
