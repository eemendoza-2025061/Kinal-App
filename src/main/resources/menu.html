<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: #1e293b !important; /* Fondo navbar (Slate 800) */
            border-bottom: 1px solid #334155;
            padding-top: 1.25rem !important;  /* Más padding vertical en navbar */
            padding-bottom: 1.25rem !important;
        }
        .main-container {
            padding-top: 5rem !important; /* Más espacio superior para el contenido */
            padding-bottom: 5rem !important;
        }
        .dashboard-card {
            background-color: #1e293b; /* Fondo de tarjetas */
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem 1.5rem !important; /* Mucho más relleno interno (padding) */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dashboard-card:hover {
            transform: translateY(-8px);
            border-color: #6366f1; /* Cambio de borde a índigo al hacer hover */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .icon-box {
            width: 70px;
            height: 70px;
            margin: 0 auto 2rem; /* Más separación inferior del icono */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
        }
        /* Variaciones de color estilo Neón Sutil */
        .icon-blue { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .icon-green { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .icon-purple { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .icon-amber { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; }

        /* Botones estilizados */
        .btn-custom {
            border-radius: 10px;
            padding: 0.75rem 1.5rem; /* Más padding en botones */
            font-weight: 600;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-lg">
    <div class="container">
        <a class="navbar-brand fw-bold text-white d-flex align-items-center fs-4" href="/dashboard"
            KinalApp
        </a>
        <div class="navbar-nav ms-auto align-items-center">
            <span class="navbar-text me-4 text-light fs-6">
                <i class="bi bi-person-circle me-2 text-info"></i><span sec:authentication="name">Usuario</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-custom btn-sm px-4">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container main-container">
    <div class="mb-5 text-center text-md-start">
        <h1 class="fw-bold text-white display-5">Panel de Control</h1>
        <p class="text-secondary fs-5">Bienvenido al ecosistema de administración de KinalApp</p>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card h-100 text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="icon-box icon-blue">
                            <i class="bi bi-people-fill fs-2"></i>
                        </div>
                        <h4 class="card-title fw-bold text-white mb-3">Clientes</h4>
                    </div>
                    <a href="/web/clientes" class="btn btn-primary btn-custom w-100">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card h-100 text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="icon-box icon-green">
                            <i class="bi bi-box-seam-fill fs-2"></i>
                        </div>
                        <h4 class="card-title fw-bold text-white mb-3">Productos</h4>
                    </div>
                    <a href="/web/productos" class="btn btn-success btn-custom w-100">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card h-100 text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="icon-box icon-purple">
                            <i class="bi bi-person-badge-fill fs-2"></i>
                        </div>
                        <h4 class="card-title fw-bold text-white mb-3">Usuarios</h4>
                    </div>
                    <a href="/web/usuarios" class="btn btn-warning btn-custom text-dark w-100">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card h-100 text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="icon-box icon-amber">
                            <i class="bi bi-cart-fill fs-2"></i>
                        </div>
                        <h4 class="card-title fw-bold text-white mb-3">Ventas</h4>
                    </div>
                    <a href="web/ventas" class="btn btn-info btn-custom text-dark w-100">Ver</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
